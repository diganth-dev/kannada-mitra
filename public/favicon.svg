<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="circleClip">
      <rect width="64" height="64" rx="16" ry="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <!-- Top Half Yellow -->
    <rect width="64" height="32" fill="#FFD100"/>
    <!-- Bottom Half Red -->
    <rect y="32" width="64" height="32" fill="#D32F2F"/>
    <!-- Kannada Script 'ಕ' centered -->
    <circle cx="32" cy="32" r="20" fill="#FFFFFF" fill-opacity="0.95" stroke="#B71C1C" stroke-width="2"/>
    <text x="32" y="39" font-family="'Noto Sans Kannada', 'Nirmala UI', sans-serif" font-size="24" font-weight="900" text-anchor="middle" fill="#991B1B">ಕ</text>
  </g>
</svg>